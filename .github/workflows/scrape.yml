name: scrape-and-deploy

on:
  schedule:
    - cron: "0 22,3,9 * * *"   # UTC 기준. 한국시간 07시/12시/18시경 하루 3회
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write               # data.json 커밋용
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update data.json ($(date -u +%FT%TZ))"
            git push
          fi

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."               # index.html + data.json 을 그대로 배포
      - uses: actions/deploy-pages@v4
