# ============================================================
#  수집 대상 사이트 목록 (제공된 37개 전부 등록)
# ------------------------------------------------------------
#  [상태 표기]
#   READY  : 서버 렌더링 확인/추정 — 배포 시 바로 수집 예상
#   SPA    : JS로 목록을 그림 — Playwright로 수집(본 도구가 처리), 첫 실행 후 selector 튜닝 권장
#   ATS    : 외부 채용 플랫폼(Incruit 등) — 구조 달라 개별 확인 필요
#   FIXURL : 제공된 주소가 메인/폐지 페이지 — 실제 '목록 페이지' 주소로 교체 필요
#
#  [필드]
#   name/url (필수) · wait_for/settle_ms/topics/row/title/date (선택)
#   topics 지정 시: 제목에 그 키워드가 있는 글만 수집(도서관/사서만 걸러낼 때)
#
#  ※ 기관명 중 일부는 도메인 기준 추정입니다. 필요 시 수정하세요.
#  ※ 선택자 튜닝: python scrape.py --debug  → debug/기관명.html 확인
# ============================================================

